<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Juegos</title>
</head>
<body>
	<h1>Todos los juegos</h1>
	<ul>
		{% for juego in juegos %}
			<li>
				{{ juego.titulo }}
				<a href="{% url 'evaluacion:detalle' juego.id %}">Ver detalle</a>
			</li>
		{% empty %}
			<li>No hay juegos disponibles.</li>
		{% endfor %}
	</ul>
</body>
</html>
