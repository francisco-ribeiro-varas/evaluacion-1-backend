<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ juego.titulo }}</title>
</head>
<body>
    <h1>{{ juego.titulo }}</h1>
    <dl>
        <dt>ID</dt>
        <dd>{{ juego.id }}</dd>
        <dt>Plataforma</dt>
        <dd>{{ juego.plataforma }}</dd>
        <dt>Precio</dt>
        <dd>${{ juego.precio }}</dd>
        <dt>Horas</dt>
        <dd>{{ juego.horas }}</dd>
        <dt>Multijugador</dt>
        <dd>{{ juego.multijugador|yesno:"Sí,No" }}</dd>
        <dt>Oferta</dt>
        <dd>{{ juego.oferta|yesno:"Sí,No" }}</dd>
        <dt>Descripción</dt>
        <dd>{{ juego.descripcion }}</dd>
    </dl>
    <a href="{% url 'evaluacion:inicio' %}">Volver al inicio</a>
</body>
</html>
